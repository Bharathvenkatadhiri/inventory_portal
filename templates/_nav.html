{% load static %}
<header class="shrink-0 border-b border-gray-200 bg-white" x-data="{ mobileOpen: false }" @keydown.escape.window="mobileOpen = false">
    <div class="mx-auto flex h-[72px] max-w-7xl items-center justify-between gap-6 px-6 lg:px-8">
        <a href="{% url 'home' %}" class="flex shrink-0 items-center gap-2.5">
            {% include "_wordmark.html" with size="text-2xl" %}
        </a>

        <nav class="hidden items-center gap-8 self-stretch lg:flex">
            <a href="{% url 'home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}nav-link-active{% endif %}">Home</a>
            <a href="{% url 'about' %}" class="nav-link {% if request.resolver_match.url_name == 'about' %}nav-link-active{% endif %}">About Us</a>
            <a href="{% url 'how-it-works' %}" class="nav-link {% if request.resolver_match.url_name == 'how-it-works' %}nav-link-active{% endif %}">How It Works</a>
            <a href="{% url 'pricing' %}" class="nav-link {% if request.resolver_match.url_name == 'pricing' %}nav-link-active{% endif %}">Pricing</a>
            <a href="{% url 'contact' %}" class="nav-link {% if request.resolver_match.url_name == 'contact' %}nav-link-active{% endif %}">Contact</a>
        </nav>

        <div class="hidden shrink-0 items-center gap-3 lg:flex">
            <a href="{% url 'login' %}" class="btn-outline">Log In</a>
            <a href="{% url 'register' %}" class="btn-primary">Get Started</a>
        </div>

        <div class="flex shrink-0 items-center gap-3 lg:hidden">
            <a href="{% url 'register' %}" class="btn-primary">Get Started</a>
            <button type="button" @click="mobileOpen = !mobileOpen" :aria-expanded="mobileOpen.toString()" aria-haspopup="true" aria-label="Toggle menu" class="flex h-9 w-9 items-center justify-center rounded-md text-navy-900 hover:bg-gray-100">
                <svg x-show="!mobileOpen" viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                <svg x-show="mobileOpen" x-cloak viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
    </div>

    <nav x-show="mobileOpen" x-cloak x-transition.opacity @click.outside="mobileOpen = false" class="border-t border-gray-200 bg-white px-6 pb-4 pt-2 lg:hidden">
        <a href="{% url 'home' %}" class="block rounded-md px-3 py-2.5 text-sm font-semibold {% if request.resolver_match.url_name == 'home' %}bg-gray-100 text-navy-900{% else %}text-gray-700{% endif %}">Home</a>
        <a href="{% url 'about' %}" class="block rounded-md px-3 py-2.5 text-sm font-semibold {% if request.resolver_match.url_name == 'about' %}bg-gray-100 text-navy-900{% else %}text-gray-700{% endif %}">About Us</a>
        <a href="{% url 'how-it-works' %}" class="block rounded-md px-3 py-2.5 text-sm font-semibold {% if request.resolver_match.url_name == 'how-it-works' %}bg-gray-100 text-navy-900{% else %}text-gray-700{% endif %}">How It Works</a>
        <a href="{% url 'pricing' %}" class="block rounded-md px-3 py-2.5 text-sm font-semibold {% if request.resolver_match.url_name == 'pricing' %}bg-gray-100 text-navy-900{% else %}text-gray-700{% endif %}">Pricing</a>
        <a href="{% url 'contact' %}" class="block rounded-md px-3 py-2.5 text-sm font-semibold {% if request.resolver_match.url_name == 'contact' %}bg-gray-100 text-navy-900{% else %}text-gray-700{% endif %}">Contact</a>
        <a href="{% url 'login' %}" class="mt-2 block rounded-md border border-gray-300 px-3 py-2.5 text-center text-sm font-semibold text-navy-900">Log In</a>
    </nav>
</header>
