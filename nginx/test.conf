# Reverse proxy for the test stack (docker-compose.test.yml). Everything
# goes to gunicorn except /media/: with DEBUG=False, Django itself never
# serves media (core/urls.py only wires up that route when DEBUG=True), so
# nginx serves it directly from the volume it shares with the web container.
# /static/ is NOT special-cased — whitenoise (core/settings.py's STORAGES)
# serves it from inside the Django app itself.
#
# TLS for test.makesetu.in is terminated upstream of this box (ALB/Cloudflare
# etc.), which talks plain HTTP to this nginx but sets its own
# X-Forwarded-Proto — passed through below so SECURE_PROXY_SSL_HEADER sees
# the truth. That only holds if nothing can reach this box's port 80 except
# that proxy (a spoofed header otherwise); lock that down at the security
# group/firewall, not here.
server {
    listen 80;
    server_name test.makesetu.in;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name test.makesetu.in;

    ssl_certificate /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

    # Drawings/spec uploads run up to ~100 MB (see gunicorn.conf.py); give
    # some headroom above that.
    client_max_body_size 110M;

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
