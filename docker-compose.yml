# Local development stack: bundles Postgres/Redis containers alongside the
# app so you don't need anything installed locally beyond Docker.
#
# Usage: `docker compose up` — Compose auto-merges docker-compose.override.yml
# on top of this file automatically (bind mounts, runserver, exposed
# db/redis ports), no extra flags needed.
#
# This file is NOT used in production — see docker-compose.prod.yml, which
# is a separate, standalone file (no bundled db/redis; points at managed
# instances instead).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  web:
    build: .
    env_file:
      - .env
    environment:
      # Override .env's localhost-based URLs (correct for running Django
      # directly on the host) with the in-network service names Compose
      # gives these containers.
      DATABASE_URL: postgres://postgres:postgres@db:5432/marketplace
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A core worker -l info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/marketplace
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
