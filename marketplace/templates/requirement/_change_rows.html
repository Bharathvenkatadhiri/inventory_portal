<div class="mt-3 overflow-x-auto">
    <table class="w-full text-left text-sm">
        <thead><tr class="text-xs uppercase tracking-wide text-gray-400"><th class="pb-1 pr-4 font-semibold">What</th><th class="pb-1 pr-4 font-semibold">Current</th><th class="pb-1 font-semibold">Proposed</th></tr></thead>
        <tbody>
            {% for row in rows %}
            <tr><td class="py-0.5 pr-4 text-gray-600">{{ row.label }}</td><td class="py-0.5 pr-4 text-gray-500 line-through">{{ row.old }}</td><td class="py-0.5 font-bold text-navy-900">{{ row.new }}</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
