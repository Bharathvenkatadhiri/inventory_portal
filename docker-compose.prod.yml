# Production stack. Standalone on purpose — it does NOT layer on top of
# docker-compose.yml (that file's web service hardcodes the dev db
# container hostname, which would silently override the real managed
# DATABASE_URL you set in .env). No bundled Postgres here — point .env at
# a managed instance (see .env.prod.example).
#
# Usage:
#   cp .env.prod.example .env   # fill in every value
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Workers/threads/timeouts come from gunicorn.conf.py (tunable via .env).
# createcachetable is a no-op unless CACHE_URL uses the database cache.
services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application"
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
