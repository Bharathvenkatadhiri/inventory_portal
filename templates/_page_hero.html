{% load static %}
<section class="relative isolate overflow-hidden bg-navy-900">
    <div class="absolute inset-0 bg-gradient-to-br from-navy-800 via-navy-900 to-navy-950"></div>
    <div class="pointer-events-none absolute inset-y-0 right-0 hidden w-[420px] opacity-30 lg:block"
         style="background-image:url('{% static "images/hero-machining.jpg" %}'); background-size:cover; background-position:center;"></div>
    <div class="pointer-events-none absolute inset-y-0 right-0 hidden w-[420px] bg-gradient-to-r from-navy-900 via-navy-900/60 to-transparent lg:block"></div>
    <svg class="pointer-events-none absolute inset-0 h-full w-full text-white/[0.07]" aria-hidden="true">
        <defs>
            <pattern id="hero-grid" width="56" height="56" patternUnits="userSpaceOnUse">
                <path d="M56 0H0V56" fill="none" stroke="currentColor" stroke-width="1"/>
            </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#hero-grid)"/>
    </svg>
    <svg class="pointer-events-none absolute -right-16 -top-20 h-[30rem] w-[30rem] text-white/[0.06]" viewBox="0 0 400 400" fill="none" aria-hidden="true">
        <circle cx="230" cy="170" r="130" stroke="currentColor" stroke-width="2"/>
        <circle cx="230" cy="170" r="85" stroke="currentColor" stroke-width="2"/>
        <circle cx="230" cy="170" r="40" stroke="currentColor" stroke-width="2"/>
        <rect x="40" y="230" width="140" height="140" stroke="currentColor" stroke-width="2"/>
    </svg>

    <div class="relative mx-auto max-w-7xl px-6 py-16 lg:px-8 lg:py-20">
        <p class="text-xs font-bold uppercase tracking-[0.22em] text-white/70">{{ eyebrow }}</p>
        <h1 class="mt-5 max-w-3xl text-4xl font-extrabold leading-[1.1] tracking-tight text-white sm:text-5xl">{{ heading|safe }}</h1>
        <p class="mt-5 max-w-xl text-base leading-relaxed text-white/75">{{ sub }}</p>
    </div>
</section>
