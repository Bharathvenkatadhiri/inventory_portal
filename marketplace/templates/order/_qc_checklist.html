{% load static %}
<h2 class="text-lg font-bold text-navy-900">QC checklist</h2>
{% if qc_items %}
<ul class="mt-3 space-y-2">
    {% for item in qc_items %}
    <li>
        <form method="post" action="{% url 'order-qc-toggle' bill.billno forloop.counter0 %}"
              hx-post="{% url 'order-qc-toggle' bill.billno forloop.counter0 %}" hx-target="#qc-checklist-block" hx-swap="innerHTML">
            {% csrf_token %}
            <button type="submit" {% if not is_supplier %}disabled{% endif %} class="flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-left text-sm hover:bg-gray-50 disabled:cursor-default disabled:hover:bg-transparent">
                <span class="flex h-5 w-5 shrink-0 items-center justify-center rounded border-2 {% if item.checked %}border-accent-500 bg-accent-500 text-white{% else %}border-gray-300{% endif %}">
                    {% if item.checked %}<svg viewBox="0 0 20 20" class="h-3.5 w-3.5" fill="currentColor"><path fill-rule="evenodd" d="M16.7 5.3a1 1 0 010 1.4l-7 7a1 1 0 01-1.4 0l-3-3a1 1 0 111.4-1.4L8 11.6l6.3-6.3a1 1 0 011.4 0z" clip-rule="evenodd"/></svg>{% endif %}
                </span>
                <span class="{% if item.checked %}text-gray-400 line-through{% else %}text-navy-900{% endif %}">{{ item.label }}</span>
                {% if item.checked and item.checked_by_name %}<span class="ml-auto shrink-0 text-xs text-gray-400">{{ item.checked_by_name }}</span>{% endif %}
            </button>
        </form>
    </li>
    {% endfor %}
</ul>
{% else %}
<p class="mt-3 text-sm text-gray-500">QC checklist will appear once production starts.</p>
{% endif %}
