{# One shared record seen from both companies (landing, How It Works). #}
<figure class="card">
    <svg viewBox="0 0 440 190" class="h-auto w-full" role="img" aria-labelledby="two-views-title">
        <title id="two-views-title">Your company's purchase order is the same record as your supplier's incoming sales order.</title>
        <rect x="10" y="20" width="140" height="150" rx="12" fill="#f2f6fa" stroke="#e3eaf2" stroke-width="1.5"/>
        <text x="80" y="48" text-anchor="middle" fill="#11355c" font-size="13" font-weight="700">Your company</text>
        <text x="80" y="66" text-anchor="middle" fill="#6b7280" font-size="11">Purchase module</text>
        <text x="80" y="110" text-anchor="middle" fill="#11355c" font-size="12">Purchase order</text>
        <rect x="290" y="20" width="140" height="150" rx="12" fill="#f2f6fa" stroke="#e3eaf2" stroke-width="1.5"/>
        <text x="360" y="48" text-anchor="middle" fill="#11355c" font-size="13" font-weight="700">Your supplier</text>
        <text x="360" y="66" text-anchor="middle" fill="#6b7280" font-size="11">Sales module</text>
        <text x="360" y="110" text-anchor="middle" fill="#11355c" font-size="12">Incoming order</text>
        <rect x="160" y="78" width="120" height="56" rx="10" fill="#fef5ec" stroke="#f57921" stroke-width="2"/>
        <text x="220" y="102" text-anchor="middle" fill="#11355c" font-size="13" font-weight="700">PO-0142</text>
        <text x="220" y="120" text-anchor="middle" fill="#6b7280" font-size="11">one shared record</text>
        <path d="M150 106h10M280 106h10" stroke="#f57921" stroke-width="2"/>
    </svg>
    <figcaption class="mt-3 text-xs text-gray-500">Both companies read the same order. Each sees only its own costs, notes and other partners.</figcaption>
</figure>
