{# Period switcher + CSV download. Expects: report. #}
<div class="flex flex-wrap items-center gap-2">
    <nav class="inline-flex rounded-lg border border-gray-200 bg-white p-0.5 text-sm" aria-label="Report period">
        {% for key, label, months in report.periods %}
        <a href="?period={{ key }}" class="rounded-md px-3 py-1.5 font-medium {% if report.period == key %}bg-navy-900 text-white{% else %}text-gray-600 hover:text-navy-900{% endif %}"{% if report.period == key %} aria-current="page"{% endif %}>{{ label }}</a>
        {% endfor %}
    </nav>
    <a href="?period={{ report.period }}&format=csv" class="btn-outline text-sm">Download CSV</a>
</div>
