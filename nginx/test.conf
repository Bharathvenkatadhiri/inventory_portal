# Reverse proxy for the test stack (docker-compose.test.yml). Everything
# goes to gunicorn except /media/: with DEBUG=False, Django itself never
# serves media (core/urls.py only wires up that route when DEBUG=True), so
# nginx serves it directly from the volume it shares with the web container.
# /static/ is NOT special-cased — whitenoise (core/settings.py's STORAGES)
# serves it from inside the Django app itself.
#
# Browsers reach test.makesetu.in through Cloudflare, which connects to this
# nginx over HTTPS using the Cloudflare origin certificate below (Cloudflare
# SSL mode must be "Full (strict)" — "Flexible" would send plain HTTP to
# port 80 and loop on the redirect). nginx then talks plain HTTP to
# gunicorn and sends X-Forwarded-Proto: https, which Django trusts through
# SECURE_PROXY_SSL_HEADER. That setting must stay on (the DEBUG=False
# default): without it Django thinks every request is HTTP and rejects
# every form POST with "CSRF verification failed (Origin checking failed)".
server {
    listen 80;
    server_name test.makesetu.in;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name test.makesetu.in;

    ssl_certificate /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin-key.pem;

    # Drawings/spec uploads run up to ~100 MB (see gunicorn.conf.py); give
    # some headroom above that.
    client_max_body_size 110M;

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
