# Test/staging stack for a single EC2 instance — a disposable environment
# to try the app behind a real domain/IP without the production assumptions
# (managed Postgres, S3, a load balancer terminating TLS in front of it).
# Bundles its own Postgres and an nginx reverse proxy, since there's no
# managed DB or ALB in front of this box. See .env.test.example.
#
# Usage:
#   cp .env.test.example .env   # fill in the blanks (SECRET_KEY, ALLOWED_HOSTS, ...)
#   docker compose -f docker-compose.test.yml up -d --build
#
# Not layered on docker-compose.yml, for the same reason docker-compose.prod.yml
# isn't: that file's web service hardcodes the dev db hostname, which would
# silently override whatever DATABASE_URL this file sets.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: makesetu
      POSTGRES_USER: makesetu_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makesetu_app"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py createcachetable &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application"
    env_file:
      - .env
    environment:
      # Override .env's DATABASE_URL with the in-network service name
      # Compose gives the db container — same reasoning as docker-compose.yml.
      DATABASE_URL: postgres://makesetu_app:${POSTGRES_PASSWORD:-postgres}@db:5432/makesetu
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/test.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media:ro
    ports:
      - "80:80"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  media:
