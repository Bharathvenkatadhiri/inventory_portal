{% load static %}
<aside class="flex h-full w-64 shrink-0 flex-col bg-navy-950 text-white">
    <a href="{% url 'home' %}" class="flex items-center gap-2.5 px-6 py-5">
        <img src="{% static 'images/logo.svg' %}" alt="ManufactureHub" class="h-8 w-8">
        <span class="text-lg font-extrabold tracking-tight text-white">Manufacture<span class="text-accent-500">Hub</span></span>
    </a>

    <nav class="flex-1 space-y-1 px-3 py-2">
        <a href="{% url 'home' %}" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors {% if request.resolver_match.url_name == 'home' %}bg-white/10 text-white{% else %}text-white/70 hover:bg-white/5 hover:text-white{% endif %}">
            <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Dashboard
        </a>
        <a href="{% url 'requirement-list' %}" class="flex items-center justify-between gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors {% if request.resolver_match.url_name == 'requirement-list' %}bg-white/10 text-white{% else %}text-white/70 hover:bg-white/5 hover:text-white{% endif %}">
            <span class="flex items-center gap-3">
                <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v12H7l-3 3z"/></svg>
                RFQ inbox
            </span>
            {% if sidebar_new_rfq_count %}<span class="rounded-full bg-accent-500 px-2 py-0.5 text-xs font-bold">{{ sidebar_new_rfq_count }}</span>{% endif %}
        </a>
        <a href="{% url 'quote-list' %}" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors {% if request.resolver_match.url_name == 'quote-list' %}bg-white/10 text-white{% else %}text-white/70 hover:bg-white/5 hover:text-white{% endif %}">
            <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.6 11.1L12.9 3.4a2 2 0 00-1.4-.6H4.9a1 1 0 00-1 1v6.6c0 .5.2 1 .6 1.4l7.7 7.7a2 2 0 002.8 0l5.6-5.6a2 2 0 000-2.8z"/><circle cx="8" cy="8" r="1.4"/></svg>
            Quotes
        </a>
        <a href="{% url 'orders-list' %}" class="flex items-center justify-between gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors {% if request.resolver_match.url_name == 'orders-list' or request.resolver_match.url_name == 'order-detail' %}bg-white/10 text-white{% else %}text-white/70 hover:bg-white/5 hover:text-white{% endif %}">
            <span class="flex items-center gap-3">
                <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
                Production
            </span>
            {% if sidebar_active_orders_count %}<span class="rounded-full bg-white/15 px-2 py-0.5 text-xs font-bold">{{ sidebar_active_orders_count }}</span>{% endif %}
        </a>
        <a href="{% url 'company-profile' %}" class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors {% if request.resolver_match.url_name == 'company-profile' %}bg-white/10 text-white{% else %}text-white/70 hover:bg-white/5 hover:text-white{% endif %}">
            <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="14" rx="1"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
            Company profile
        </a>
    </nav>
</aside>
