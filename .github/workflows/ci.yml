name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: makesetu
          POSTGRES_USER: makesetu_app
          POSTGRES_PASSWORD: makesetu_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makesetu_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "False"
      SECRET_KEY: ci-test-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://makesetu_app:makesetu_app@localhost:5432/makesetu
      # Tests talk plain HTTP to the test client; don't redirect them to HTTPS.
      SECURE_SSL_REDIRECT: "False"
      # Production settings refuse to start without an S3 bucket
      # (core/settings.py). CI has none and uses local disk for uploads, so
      # opt out explicitly here. Never set this on a real deployment.
      ALLOW_LOCAL_MEDIA_STORAGE: "True"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      # The frontend's API types are generated from this schema; it must
      # match the API the code defines.
      - name: Check the API schema is up to date
        run: |
          python manage.py export_openapi_schema --api core.api.api --output frontend/packages/api/openapi.json --indent 2 --sorted
          git diff --exit-code frontend/packages/api/openapi.json || (echo "Run: python manage.py export_openapi_schema --api core.api.api --output frontend/packages/api/openapi.json --indent 2 --sorted" && exit 1)

      - name: Run tests
        run: pytest

  # The signed-in app (frontend/): types, tests and a production build.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          # The pnpm version comes from frontend/package.json's packageManager.
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the generated API types match the schema
        run: |
          pnpm generate-api
          git diff --exit-code packages/api/src/schema.ts || (echo "Run: pnpm generate-api" && exit 1)

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
