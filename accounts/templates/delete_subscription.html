{% extends "base.html" %}
{% block title %}Deactivate Subscription{% endblock title %}
{% block content %}
<div class="card max-w-lg">
    <h1 class="text-lg font-semibold text-gray-900 mb-2">Deactivate subscription</h1>
    <p class="text-sm text-gray-600 mb-6">Are you sure you want to deactivate the subscription for {{ object.user_profile }}?</p>
    <form method="post" class="flex gap-3">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Yes, deactivate</button>
        <a href="{% url 'subscription-list' %}" class="btn-secondary">Cancel</a>
    </form>
</div>
{% endblock content %}
