name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: makesetu
          POSTGRES_USER: makesetu_app
          POSTGRES_PASSWORD: makesetu_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U makesetu_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "False"
      SECRET_KEY: ci-test-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://makesetu_app:makesetu_app@localhost:5432/makesetu
      # Tests talk plain HTTP to the test client; don't redirect them to HTTPS.
      SECURE_SSL_REDIRECT: "False"
      # Production settings refuse to start without an S3 bucket
      # (core/settings.py). CI has none and uses local disk for uploads, so
      # opt out explicitly here. Never set this on a real deployment.
      ALLOW_LOCAL_MEDIA_STORAGE: "True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest
