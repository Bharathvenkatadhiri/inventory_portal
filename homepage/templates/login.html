<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — ManufactureHub</title>
    <link rel="stylesheet" href="{% load static %}{% static 'css/tailwind-built.css' %}">
</head>
<body class="h-full flex items-center justify-center px-4">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <a href="{% url 'home' %}" class="text-2xl font-semibold text-brand-700">ManufactureHub</a>
            <p class="text-gray-500 text-sm mt-1">Log in to your account</p>
        </div>
        <div class="card">
            {% if form.non_field_errors %}
            <div class="mb-4 rounded-md bg-red-50 px-4 py-3 text-sm text-red-700">
                {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
            </div>
            {% endif %}
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label for="id_username" class="field-label">Email</label>
                    <input type="email" name="username" id="id_username" required autofocus class="field-input" placeholder="you@example.com">
                </div>
                <div>
                    <label for="id_password" class="field-label">Password</label>
                    <input type="password" name="password" id="id_password" required class="field-input">
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn-primary w-full">Log in</button>
            </form>
        </div>
        <p class="text-center text-sm text-gray-500 mt-6">
            New here? <a href="{% url 'register' %}" class="text-brand-600 hover:underline">Create an account</a>
        </p>
    </div>
</body>
</html>
